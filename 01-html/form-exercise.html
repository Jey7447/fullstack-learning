<!DOCTYPE html>
<html>
    <head>
    <title>Developer Community Registration</title>
    </head>

    <body>
        <header>
            <h1>
                Developer Community Registration Form
            </h1>
            <p>
                Join our Developer Community
            </p>
        </header>
        <main> 
            <form>
                <label for="name">Name</label>
                <input type="text" id="name" name="name">

                <label for="email">Email</label>
                <input type="email" id="email" name="email">

                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone">

                <label for="date">Date of birth</label>
                <input type="date" id="date" name="date of birth">

                <label for="experience">Programming experience</label>
                <select id="experience">
                    <option value="Beginner"></option>
                    <option value="Intermediate"></option>
                    <option value="Advanced"></option>

                </select>

                <label for="about_you">About you</label>
                <textarea name="about_you" id="about_you"></textarea>

                <p>Technologies you know</p>
                    <label for="html">HTML</label>
                    <input type="checkbox" id="html">
                    <label for="css">CSS</label>
                    <input type="checkbox" id="css">
                    <label for="javascript">JavaScript</label>
                    <input type="checkbox" id="javascript">
                    <label for="react">React</label>
                    <input type="checkbox" id="react">
                    <label for="python">Python</label>
                    <input type="checkbox" id="python">

                

                <label for="password">Password</label>
                <input type="password" id="password">

                <label for="terms">I agree to the community terms</label>
                <input type="checkbox" id="terms">

                <button> type="submit">Submit</button>
            </form>
        </main>
        <footer>
            <p>
                Thank you for filling the form
            </p>
        </footer>
    </body>

    



</html>
